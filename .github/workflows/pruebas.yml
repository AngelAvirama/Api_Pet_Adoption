name: CI - Pruebas

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir imagen Docker
        run: docker compose build api

      - name: Levantar PostgreSQL
        run: docker compose up -d db

      - name: Esperar PostgreSQL
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U postgres -d pet_adoption && break
            sleep 2
          done

      - name: Aplicar migraciones con Docker
        run: docker compose run --rm api npx prisma migrate deploy

      - name: Ejecutar tests y cobertura con Docker
        run: docker compose run --rm api npm run test:ci

      - name: Limpiar contenedores
        if: always()
        run: docker compose down -v

      - name: Deploy a Pruebas
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/testing'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_TEST }}"