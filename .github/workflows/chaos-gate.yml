name: Chaos gate - Indisponibilidad de la base de datos

# Quality gate of Chaos Engineering. Runs the declarative experiment
# (chaos/experiments/indisponibilidad-adopcion.json) with the declared load
# (chaos/k6/adopcion.js) against the adoption API on AWS and fails when the
# target metric (error rate of GET /api/v2/animals/random) does not meet the
# threshold of chaos/slo.json.
#
# Manual only and only inside an agreed window: it never runs on push. The
# injected fault is always reverted (rollback-strategy=always, the explicit
# "Reversion" step with if: always() and, as a last net, the fault TTL).
# No continue-on-error: if the load, the experiment, the measurement or the
# rollback fail, the workflow fails and keeps the evidence as an artifact.
on:
  workflow_dispatch:
    inputs:
      ventana_autorizada:
        description: "Confirmo que estamos en la ventana acordada con el grupo y que la infraestructura es nuestra"
        type: boolean
        default: false
      modo:
        description: "experimento = inyecta el fallo y corre la puerta; estado-estable = solo la carga, sin fallo (linea base)"
        type: choice
        options: ["experimento", "estado-estable"]
        default: "experimento"
      ronda:
        description: "Ronda a medir (debe coincidir con RESILIENCE_ENABLED desplegado: 0=false, 1=true)"
        type: choice
        options: ["0", "1"]
        default: "0"
      base_url:
        description: "URL de la API de adopcion (ALB)"
        default: "http://pet-adoption-demo-alb-66249762.us-east-1.elb.amazonaws.com"
      perfil:
        description: "Perfil de carga (completo = 5 min, humo = 15 s solo para validar)"
        type: choice
        options: ["completo", "humo"]
        default: "completo"

permissions:
  contents: read

concurrency:
  group: chaos-gate
  cancel-in-progress: false

env:
  CHAOS_BASE_URL: ${{ inputs.base_url }}
  RONDA: ${{ inputs.ronda }}
  PERFIL: ${{ inputs.perfil }}
  RESULTS_DIR: chaos/results
  PYTHONUTF8: "1"

jobs:
  experimento:
    name: Experimento y puerta de calidad (ronda ${{ inputs.ronda }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ventana autorizada
        if: ${{ inputs.ventana_autorizada != true }}
        run: |
          echo "::error::El experimento solo corre dentro de una ventana acordada. Marque ventana_autorizada."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias, Chaos Toolkit y k6
        run: |
          npm ci --no-audit --no-fund
          pip install --quiet "chaostoolkit==1.19.0"

      - uses: grafana/setup-k6-action@v1

      # Validation before touching anything
      - name: Validar experimento, carga, puerta y ronda desplegada
        env:
          CHAOS_TOKEN: ${{ secrets.CHAOS_TOKEN }}
        run: |
          test -n "$CHAOS_TOKEN" || { echo "::error::Falta el secreto CHAOS_TOKEN"; exit 1; }
          chaos validate chaos/experiments/indisponibilidad-adopcion.json
          k6 inspect chaos/k6/adopcion.js >/dev/null
          npx jest tests/chaos.gate.test.js
          node chaos/probes.js salud
          node chaos/probes.js ronda --esperada "$RONDA" || {
            echo "::error::La API esta desplegada en otra ronda (ver X-Ronda). Despliegue con resilience_enabled correcto."; exit 1; }
          node chaos/probes.js sin-fallos

      - name: Medir el estado estable (sin fallo)
        if: ${{ inputs.modo == 'estado-estable' }}
        run: |
          mkdir -p "$RESULTS_DIR"
          k6 run --env BASE_URL="$CHAOS_BASE_URL" --env RONDA="estable-r$RONDA" \
            --env PERFIL="$PERFIL" --env RESULTS_DIR="$RESULTS_DIR" chaos/k6/adopcion.js

      - name: Ejecutar el experimento de caos
        if: ${{ inputs.modo == 'experimento' }}
        env:
          CHAOS_TOKEN: ${{ secrets.CHAOS_TOKEN }}
        run: |
          mkdir -p "$RESULTS_DIR"
          chaos run --rollback-strategy=always \
            --journal-path "$RESULTS_DIR/journal-ronda-$RONDA.json" \
            chaos/experiments/indisponibilidad-adopcion.json

      # Even if the step above was cancelled or crashed, the fault is removed
      # here. This step fails on purpose if the switch still shows a fault.
      - name: Reversion explicita del fallo
        if: always()
        env:
          CHAOS_TOKEN: ${{ secrets.CHAOS_TOKEN }}
        run: |
          node chaos/probes.js revertir || true
          sleep 5
          node chaos/probes.js sin-fallos

      - name: Puerta de calidad
        if: ${{ always() && inputs.modo == 'experimento' }}
        run: |
          node chaos/gate.js --ronda "$RONDA" --out "$RESULTS_DIR/gate-ronda-$RONDA.json"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Chaos gate ${{ inputs.modo }} ronda $RONDA ($PERFIL)"
            echo '```json'
            cat "$RESULTS_DIR/gate-ronda-$RONDA.json" 2>/dev/null || echo "sin veredicto"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-${{ inputs.modo }}-ronda-${{ inputs.ronda }}-${{ github.run_number }}
          path: chaos/results/*.json
          if-no-files-found: warn
