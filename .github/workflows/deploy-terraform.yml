
name: Deploy Terraform and ECS

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm creation of AWS resources with possible costs"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: pet-adoption-terraform-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::296121913016:role/github-actions-pet-adoption
  TF_IN_AUTOMATION: "true"

jobs:
  deploy:
    name: Build and deploy API
    if: ${{ inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform -chdir=terraform init

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate

      - name: Create ECR repository
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform -chdir=terraform apply \
            -target=aws_ecr_repository.api \
            -auto-approve

      - name: Login to Amazon ECR
        id: ecr
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          REPOSITORY_URL=$(aws ecr describe-repositories \
            --repository-names pet-adoption-api \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "repository_url=$REPOSITORY_URL" >> "$GITHUB_OUTPUT"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push API image
        env:
          REPOSITORY_URL: ${{ steps.ecr.outputs.repository_url }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          docker build --tag "${REPOSITORY_URL}:${IMAGE_TAG}" .
          docker push "${REPOSITORY_URL}:${IMAGE_TAG}"

      - name: Plan infrastructure
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_image_tag: ${{ github.sha }}-${{ github.run_attempt }}
          TF_VAR_api_desired_count: "0"
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Create infrastructure with API stopped
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_image_tag: ${{ github.sha }}-${{ github.run_attempt }}
          TF_VAR_api_desired_count: "0"
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Run Prisma database migrations
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER=$(terraform -chdir=terraform output -raw ecs_cluster_name)
          TASK_DEFINITION=$(terraform -chdir=terraform output -raw api_task_definition_arn)
          SECURITY_GROUP=$(terraform -chdir=terraform output -raw ecs_security_group_id)

          SUBNETS=$(terraform -chdir=terraform output -json public_subnet_ids \
            | jq -r 'join(",")')

          NETWORK_CONFIGURATION="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}"

          TASK_RESULT=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides '{"containerOverrides":[{"name":"api","command":["npx","prisma","migrate","deploy"]}]}' \
            --output json)

          echo "$TASK_RESULT" | jq '.failures'

          TASK_ARN=$(echo "$TASK_RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "No se pudo iniciar la tarea de migración."
            exit 1
          fi

          echo "Esperando a que terminen las migraciones..."
          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN"

          TASK_DETAILS=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN")

          echo "$TASK_DETAILS" | jq '.tasks[0] | {lastStatus, stoppedReason, containers}'

          EXIT_CODE=$(echo "$TASK_DETAILS" \
            | jq -r '[.tasks[0].containers[] | select(.name == "api")][0].exitCode // empty')

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Las migraciones fallaron. Código de salida: ${EXIT_CODE:-desconocido}"
            exit 1
          fi

          echo "Migraciones de Prisma completadas correctamente."
      
      - name: Seed database
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER=$(terraform -chdir=terraform output -raw ecs_cluster_name)
          TASK_DEFINITION=$(terraform -chdir=terraform output -raw api_task_definition_arn)
          SECURITY_GROUP=$(terraform -chdir=terraform output -raw ecs_security_group_id)

          SUBNETS=$(terraform -chdir=terraform output -json public_subnet_ids \
            | jq -r 'join(",")')

          NETWORK_CONFIGURATION="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}"

          echo "Iniciando semilla de datos..."

          TASK_RESULT=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","prisma/seed.js"]}]}' \
            --output json)

          echo "$TASK_RESULT" | jq '{failures, tasks: [.tasks[]? | {taskArn, lastStatus}]}'

          TASK_ARN=$(echo "$TASK_RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "No se pudo iniciar la tarea de semilla."
            exit 1
          fi

          echo "Esperando a que termine la semilla..."
          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN"

          TASK_DETAILS=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN")

          echo "$TASK_DETAILS" | jq '.tasks[0] | {lastStatus, stoppedReason, containers}'

          EXIT_CODE=$(echo "$TASK_DETAILS" \
            | jq -r '[.tasks[0].containers[] | select(.name == "api")][0].exitCode // empty')

          if [ "$EXIT_CODE" != "0" ]; then
            echo "La semilla falló. Código de salida: ${EXIT_CODE:-desconocido}"
            exit 1
          fi

          echo "Semilla completada correctamente."

      - name: Start API service
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_image_tag: ${{ github.sha }}-${{ github.run_attempt }}
          TF_VAR_api_desired_count: "1"
        run: terraform -chdir=terraform apply -auto-approve

      - name: Verify API health
        shell: bash
        run: |
          set -euo pipefail

          API_URL=$(terraform -chdir=terraform output -raw api_url)

          echo "Comprobando ${API_URL}/api/health"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "${API_URL}/api/health"; then
              echo
              echo "API disponible correctamente."
              exit 0
            fi

            echo "Intento ${attempt}/30. Esperando 10 segundos..."
            sleep 10
          done

          echo "La API no respondió correctamente a tiempo."
          exit 1
