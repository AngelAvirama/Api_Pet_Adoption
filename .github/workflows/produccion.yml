name: CI - Producción

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pet_adoption_prod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pet_adoption_prod_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pet_adoption_prod_test
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Construir imagen Docker
        run: docker compose build api

      - name: Levantar PostgreSQL
        run: docker compose up -d db

      - name: Esperar PostgreSQL
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U postgres -d pet_adoption && break
            sleep 2
          done

      - name: Aplicar migraciones con Docker
        run: docker compose run --rm api npx prisma migrate deploy

      - name: Ejecutar tests y cobertura con Docker
        run: docker compose run --rm api npm run test:ci

      - name: Limpiar contenedores
        if: always()
        run: docker compose down -v

      - name: Deploy a Producción
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD }}"