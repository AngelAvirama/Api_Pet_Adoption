apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pet-adoption-api
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - pet-adoption
  selector:
    matchLabels:
      app: pet-adoption-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s