apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pet-adoption-api
  namespace: pet-adoption
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pet-adoption-api
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50