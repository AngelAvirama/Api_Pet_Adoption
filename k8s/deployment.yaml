apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-adoption-api
  namespace: pet-adoption
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pet-adoption-api
  template:
    metadata:
      labels:
        app: pet-adoption-api
    spec:
      containers:
        - name: pet-adoption-api
          image: pet-adoption-api:latest
          ports:
            - containerPort: 3000