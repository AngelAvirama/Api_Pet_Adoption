apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-adoption-api
  namespace: pet-adoption
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pet-adoption-api
  template:
    metadata:
      labels:
        app: pet-adoption-api
    spec:
      containers:
        - name: pet-adoption-api
          image: 296121913016.dkr.ecr.us-east-1.amazonaws.com/pet-adoption-api:1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: pet-adoption-config
            - secretRef:
                name: pet-adoption-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3